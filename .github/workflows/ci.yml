name: CI y despliegue

on:
  push:
    branches: [main]
  pull_request:
  # Botón "Run workflow" en GitHub: verifica y vuelve a desplegar todo.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.token.outputs.hay }}
    steps:
      # Sin el secreto CLOUDFLARE_API_TOKEN se verifica todo pero no se despliega.
      - id: token
        run: echo "hay=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # Cada push a main despliega las dos partes (tarda un minuto y no cuesta nada):
  # así un despliegue fallido nunca deja una de ellas atrasada.
  # La API va primero: la web nueva puede depender de un endpoint nuevo.
  desplegar-api:
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verificar.outputs.token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migraciones antes del código: el código nuevo puede usar columnas nuevas.
      - run: npx wrangler d1 migrations apply rifaclara --remote
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  desplegar-web:
    needs: [verificar, desplegar-api]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.verificar.result == 'success' && needs.verificar.outputs.token == 'true'
      && needs.desplegar-api.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
